name: unit tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run POSIX sh unit tests in the alpine + xray image
        run: tests/run.sh
      - name: The page reads an address as the daemon does
        run: node tools/check-page-addr.mjs
